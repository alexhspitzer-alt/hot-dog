<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Dog</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf4e8; color: #282219; font: 1rem system-ui, sans-serif; }
    main { max-width: 38rem; margin: auto; padding: 2rem 1.125rem 3rem; }
    h1 { font-family: Georgia, serif; font-size: clamp(3.5rem, 12vw, 6.5rem); letter-spacing: -.075em; line-height: .95; margin: 0; color: #8d2d1e; }
    h2 { font-family: Georgia, serif; margin: 0 0 .6rem; }
    p { line-height: 1.5; }
    #status { min-height: 1.5em; }
    #dogs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .65rem; }
    [hidden], #dogs[hidden] { display: none; }
    button { cursor: pointer; font: inherit; color: inherit; }
    .dog { position: relative; overflow: hidden; padding: 0; border: 1px solid #8d6e52; border-radius: .9rem; background: #efe0c9; aspect-ratio: 1; }
    .dog img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .dog span { position: absolute; bottom: 0; inset-inline: 0; padding: .42rem .15rem; color: white; background: #282219ee; font-size: clamp(.65rem, 2.5vw, .87rem); }
    .dog:hover { outline: 2px solid #8d2d1e; outline-offset: 2px; }
    button:focus-visible { outline: 3px solid #8d2d1e; outline-offset: 3px; }
    #unlocked { padding: 1.4rem; background: #fffaf1; border: 1px solid #ad8f6c; border-radius: .9rem; }
    #lock { border: 0; border-radius: .4rem; background: #8d2d1e; color: white; padding: .6rem .9rem; }
    footer { margin-top: 1.2rem; font-size: .85rem; }
    a { color: #702118; }
  </style>
</head>
<body>
<main>
  <h1>Hot Dog</h1>
  <p id="prompt">Pick the beagle to unlock the demo.</p>
  <p id="status" role="status"></p>
  <div id="dogs" role="group" aria-label="Choose a dog"></div>
  <section id="unlocked" hidden>
    <h2 tabindex="-1" id="unlocked-title">Unlocked</h2>
    <p id="message"></p>
    <button id="lock" type="button">Lock again</button>
  </section>
  <noscript>Enable JavaScript to try the dog grid.</noscript>
  <footer>Dog photos via <a href="https://dog.ceo/dog-api/">Dog API</a>.</footer>
</main>
<script type="module">
  const dogs = [
    ["beagle", "Beagle"], ["boxer", "Boxer"], ["pug", "Pug"],
    ["husky", "Husky"], ["dalmatian", "Dalmatian"], ["retriever/golden", "Golden retriever"],
    ["chow", "Chow chow"], ["rottweiler", "Rottweiler"], ["pomeranian", "Pomeranian"],
  ];
  const payload = {
  "keys": {
    "beagle": "D3/nNyt6xI6Km0zA3gL7YlkOZK5fKfOy3DW2L/YXYr4=",
    "boxer": "dYeYEQmKUm/YJsF2/eU/WoLfIrZdFuzCbJYJKrKNnew=",
    "pug": "jR1jhkBAjreztWBppPzlh+n28IoSp8vQF78HFKYD4kQ=",
    "husky": "xbbUtaUlF1G9aysuykheiE1NEXa7iudf1kqYzeqg3vg=",
    "dalmatian": "eVOyjV7Mx8qq4hPcdMuuCMu+JzbXOMhw0pSroKgvl0s=",
    "retriever/golden": "7wdVfbKUlWUrBkEEeCUsxOPJ19X5d8T7Y93jv2YeOV4=",
    "chow": "EXP99FVQ5zBUQf/WGaUO9jDbYnTjFfSmbr47WFNEbL4=",
    "rottweiler": "35bq/8bsPNcvzVrJS0l7j9UzqifAa5uoIw6OenQhKxE=",
    "pomeranian": "3L5Ft6Fu8cAXEJkCxEGCN+yBH/Zzmt7iq29eCwYUqK8="
  },
  "iv": "6EeCMsVW5die/+Y0",
  "ciphertext": "H1GxzXNNi//T/JoKx8juDJhhsaVpLbpGDyqYoWuw1075LLx025It8qX0y5USPT8QUhlEtSKQeZ5K+jbwFQM="
};
  const grid = document.querySelector("#dogs");
  const prompt = document.querySelector("#prompt");
  const status = document.querySelector("#status");
  const unlocked = document.querySelector("#unlocked");
  const message = document.querySelector("#message");
  const photos = new Map();
  let order = dogs;
  let busy = false;

  async function loadPhoto(breed) {
    try {
      const response = await fetch(`https://dog.ceo/api/breed/${breed}/images/random`);
      if (!response.ok) return null;
      const { message } = await response.json();
      return typeof message === "string" && message.startsWith("https://images.dog.ceo/") ? message : null;
    } catch {
      return null;
    }
  }

  function shuffle() {
    const next = [...dogs];
    for (let i = next.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [next[i], next[j]] = [next[j], next[i]];
    }
    if (next.every((dog, i) => dog === order[i])) next.push(next.shift());
    order = next;
  }

  function reset(focusGrid = false) {
    shuffle();
    grid.replaceChildren(...order.map(([breed, label]) => {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "dog";
      const caption = document.createElement("span");
      caption.textContent = label;
      tile.append(caption);
      if (!photos.has(breed)) photos.set(breed, loadPhoto(breed));
      photos.get(breed).then(url => {
        if (!url || !tile.isConnected) return;
        const image = new Image();
        image.alt = "";
        image.addEventListener("error", () => image.remove(), { once: true });
        image.src = url;
        tile.prepend(image);
      });
      tile.addEventListener("click", () => pick(breed));
      return tile;
    }));
    if (focusGrid) grid.querySelector("button").focus();
  }

  const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));

  async function pick(breed) {
    if (busy) return;
    busy = true;
    try {
      const key = await crypto.subtle.importKey("raw", bytes(payload.keys[breed]), "AES-GCM", false, ["decrypt"]);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.ciphertext),
      );
      message.textContent = new TextDecoder().decode(plaintext);
      status.textContent = "";
      prompt.hidden = true;
      grid.hidden = true;
      unlocked.hidden = false;
      document.querySelector("#unlocked-title").focus();
    } catch (error) {
      status.textContent = error.name === "OperationError"
        ? "Wrong dog. The grid has been shuffled. Try again."
        : "The browser couldn’t decrypt the demo.";
      reset(true);
    } finally {
      busy = false;
    }
  }

  document.querySelector("#lock").addEventListener("click", () => {
    message.textContent = "";
    unlocked.hidden = true;
    prompt.hidden = false;
    grid.hidden = false;
    reset(true);
  });

  if (globalThis.crypto?.subtle) {
    reset();
  } else {
    status.textContent = "Open the demo over HTTPS or localhost to use browser encryption.";
  }
</script>
</body>
</html>
